name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# GITHUB_TOKEN 默认只读；发布 Release 需要写 contents 权限
permissions:
  contents: write

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 版本号从 git tag 读取，需要完整历史

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # lint 的 error 会让构建失败，warning 只记录——用它挡住「权限没判」「资源重复」这类回归
      - name: 静态检查与单元测试
        run: ./gradlew lintDebug testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveNotify-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: 发布 Release 包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Settings → Secrets 配置 EXTRA_LINES 后，构建前由 tools/inject_extra.py
      # 写入 EasterEggs.kt 的占位符，产物因此与本地构建一致。未配置时该项功能静默关闭。
      - name: 注入私有条目
        env:
          EXTRA_LINES: ${{ secrets.EXTRA_LINES }}
        if: env.EXTRA_LINES != ''
        run: python3 tools/inject_extra.py

      # 正式签名必需：没有密钥时 Gradle 会回退 debug 签名，而 GitHub runner 每次的 debug 密钥
      # 都是临时生成的 —— 两次 Release 的签名不同，用户无法覆盖升级（只能卸载重装，数据全丢）。
      # 所以这里直接失败，而不是产出一个「能装但不能升级」的包。
      #   KEYSTORE_BASE64   : base64 -w0 keystore/livenotify.jks 的输出
      #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）。"
            echo "::error::缺省时会回退到 runner 临时 debug 签名，产出的 Release 无法覆盖安装上一版，已中止。"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/livenotify.jks
          printf 'storeFile=keystore/livenotify.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      # 密钥在但装错了内容（过期 keystore、别人家的 key）时，上面的非空检查拦不住——
      # 指纹必须与正式签名逐字一致。指纹算自本地 keystore/livenotify.jks：
      #   keytool -list -v -keystore keystore/livenotify.jks
      # 换密钥 = 所有旧用户都无法覆盖安装，必须显式更新这里并写进 Release 说明。
      - name: 校验签名指纹
        run: |
          BT="$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort | tail -1)"
          ACTUAL="$("${BT}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')"
          EXPECTED="284d73dfe8925a302bde55fb0a348ee92fa0ffcd2d59f8854c21b2e38323a6f2"
          echo "Release 包签名指纹: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release 包签名指纹与正式签名不符：$ACTUAL"
            echo "::error::正式指纹应为 284d73df…23a6f2。请检查 KEYSTORE_BASE64 / KEY_ALIAS 指向的密钥，已中止发布。"
            exit 1
          fi

      # tag 即版本：APK 里的 versionName / versionCode 必须与触发发布的 tag 一致，
      # 且必须高于上一个版本，否则用户的应用内更新会报「低于当前版本」或装不上。
      - name: 校验版本号与 Git Tag 一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_NAME="${TAG#v}"
          IFS='.' read -r MA MI PA <<< "$EXPECTED_NAME"
          EXPECTED_CODE=$((MA * 10000 + MI * 100 + PA))

          BT="$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort | tail -1)"
          BADGING="$("${BT}aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -m1 'package:')"
          ACTUAL_NAME="$(echo "$BADGING" | grep -o "versionName='[^']*'" | cut -d"'" -f2)"
          ACTUAL_CODE="$(echo "$BADGING" | grep -o "versionCode='[0-9]*'" | cut -d"'" -f2)"

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          PREV_CODE=""
          if [ -n "$PREV_TAG" ]; then
            PREV="${PREV_TAG#v}"; IFS='.' read -r PM PMI PP <<< "$PREV"
            PREV_CODE=$((PM * 10000 + PMI * 100 + PP))
            if [ "$ACTUAL_CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode（$ACTUAL_CODE）未高于上一版 $PREV_TAG（$PREV_CODE），用户无法覆盖安装，已中止发布"
              exit 1
            fi
          fi

          if [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ] || [ "$ACTUAL_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::APK 版本（$ACTUAL_NAME / $ACTUAL_CODE）与 tag $TAG（$EXPECTED_NAME / $EXPECTED_CODE）不一致，已中止发布"
            exit 1
          fi
          echo "版本校验通过：v$ACTUAL_NAME（versionCode $ACTUAL_CODE）"
          [ -n "$PREV_CODE" ] && echo "覆盖安装校验通过：高于 $PREV_TAG（versionCode $PREV_CODE）"

      - name: 挂到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          # 以前 Release 说明一律是空白，用户点进去只能看到附件。
          # 让 GitHub 按提交记录自动生成变更列表，Release 页面至少有东西可读。
          generate_release_notes: true
