name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# GITHUB_TOKEN 默认只读；发布 Release 需要写 contents 权限
permissions:
  contents: write

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 版本号从 git tag 读取，需要完整历史

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # lint 的 error 会让构建失败，warning 只记录——用它挡住「权限没判」「资源重复」这类回归
      - name: 静态检查与单元测试
        run: ./gradlew lintDebug testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveNotify-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: 发布 Release 包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Settings → Secrets 配置 EXTRA_LINES 后，构建前由 tools/inject_extra.py
      # 写入 EasterEggs.kt 的占位符，产物因此与本地构建一致。未配置时该项功能静默关闭。
      - name: 注入私有条目
        env:
          EXTRA_LINES: ${{ secrets.EXTRA_LINES }}
        if: env.EXTRA_LINES != ''
        run: python3 tools/inject_extra.py

      # 可选：在仓库 Settings → Secrets 配置以下四项后，CI 出正式签名包；
      # 不配置则自动回退 debug 签名（任何人都能安装，但与正式签名包不互通）。
      #   KEYSTORE_BASE64   : base64 -w0 keystore/livenotify.jks 的输出
      #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/livenotify.jks
          printf 'storeFile=keystore/livenotify.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      - name: 挂到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          # 以前 Release 说明一律是空白，用户点进去只能看到附件。
          # 让 GitHub 按提交记录自动生成变更列表，Release 页面至少有东西可读。
          generate_release_notes: true
